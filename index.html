<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edicola</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edicola">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1b19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna da lettura, come un quotidiano del mattino in versione notturna */
:root{
  --bg:#1c1b19; --surface:#252320; --raised:#2e2b27; --line:#3a3631;
  --fg:#eee8dd; --soft:#cfc7b9; --muted:#9a9286; --faint:#6f685e;
  --clay:#d97757; --clay-soft:rgba(217,119,87,.14);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:var(--serif); --scale:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:620px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:6px}

/* Barra in alto */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) 0;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar .wrap.col{display:block}
.brand{font-family:var(--serif);font-style:italic;font-weight:500;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1}
.brand b{color:var(--clay);font-style:normal;font-weight:400;margin-left:2px}
.dateline{font-size:12.5px;color:var(--muted);margin-top:3px}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--soft);font-family:var(--serif);font-size:18px}
.iconbtn:hover{background:var(--raised)}
.progress{display:flex;gap:3px;margin-top:10px;height:3px}
.progress i{flex:1;background:var(--line);border-radius:2px;transition:background .3s}
.progress i.on{background:var(--clay)}
.progress.fill{background:var(--line);border-radius:2px;gap:0}
.progress.fill b{display:block;height:100%;background:var(--clay);border-radius:2px;transition:width .3s}
.bar .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);padding:6px 0 8px;font-variant-numeric:tabular-nums}

/* Saluto */
.hello{padding:28px 0 8px}
.hello .glyph{color:var(--clay);font-size:26px;line-height:1;display:inline-block;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:rotate(0) scale(1);opacity:.9}50%{transform:rotate(25deg) scale(1.08);opacity:1}}
.hello h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.1;margin:10px 0 10px;letter-spacing:-.015em;text-wrap:balance}
.hello p{margin:0;color:var(--soft);font-family:var(--serif);font-size:18px;line-height:1.5;max-width:34em}
.stale{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--clay-soft);color:var(--fg);font-size:14px}

/* Controlli */
.controls{display:grid;gap:12px;padding:22px 0 6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--soft);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--clay);color:var(--fg);background:var(--clay-soft)}
.chip.toggle{margin-left:auto}

/* Gruppi */
.group{padding-top:26px}
.ghead{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.ghead h3{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);font-weight:600}
.ghead span{font-size:12px;color:var(--faint)}
.story{margin:18px 0 0;padding:16px 16px 4px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.story>.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);font-weight:600}
.story>h4{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2;margin:6px 0 2px}
.story .post{border-top:1px solid var(--line)}

/* Post */
.post{padding:22px 0 24px;border-bottom:1px solid var(--line);scroll-margin-top:110px}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.eyebrow .cat{color:var(--soft);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;display:inline-flex;align-items:center;gap:6px}
.eyebrow .cat::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--clay)}
.eyebrow .seen{margin-left:auto;color:var(--faint);font-size:11px}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:1px 6px}
.post h3{font-family:var(--serif);font-weight:500;font-size:calc(25px*var(--scale));line-height:1.18;letter-spacing:-.01em;margin:8px 0 10px;text-wrap:balance}
.summary{font-family:var(--text);font-size:calc(18px*var(--scale));line-height:1.55;color:var(--soft);margin:0 0 16px}
.post.is-seen h3{color:var(--soft)}

.media{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;display:grid;place-items:center}
.slide img,.slide video{width:100%;height:100%;object-fit:contain;display:block;max-width:100%}
.count{position:absolute;top:10px;right:10px;background:rgba(20,19,17,.72);color:var(--fg);font-size:12px;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.dots{display:flex;justify-content:center;gap:5px;padding:10px 0 0}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots i.on{background:var(--clay);width:14px;border-radius:3px}

.more{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--fg);font-size:14px;font-weight:500}
.more svg{transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.caption{display:none;margin-top:14px;padding-left:14px;border-left:2px solid var(--clay)}
.caption.open{display:block}
.caption p{font-family:var(--text);font-size:calc(17px*var(--scale));line-height:1.6;color:var(--fg);margin:0 0 .8em}
.caption .orig{display:inline-flex;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted);text-decoration:none}
.caption .orig:hover{color:var(--clay)}

.end{text-align:center;color:var(--faint);font-size:13px;padding:40px 0 60px;font-family:var(--serif);font-style:italic}
.end b{display:block;color:var(--clay);font-style:normal;font-size:20px;margin-bottom:6px}
.empty{padding:40px 0;color:var(--muted);text-align:center;font-family:var(--serif);font-size:17px}

/* Pannello caratteri */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet .wrap{display:grid;gap:14px}
.sheet h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row .seg{flex:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
/* Barra di posizione e salto ai non visti */
.rail{position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);right:max(3px,env(safe-area-inset-right,0px));width:14px;z-index:8}
.rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;border-radius:2px;background:var(--line)}
.rail .thumb{position:absolute;left:4px;width:6px;border-radius:3px;background:rgba(238,232,221,.28);transition:top .08s linear}
.rail .tick{position:absolute;left:2px;width:10px;height:10px;margin-top:-5px;border-radius:50%;padding:0;background:var(--clay);border:2px solid var(--bg)}
.rail .tick.seen{background:var(--faint);width:6px;height:6px;left:4px;margin-top:-3px;border:0}
.nextbtn{position:fixed;right:max(26px,calc(env(safe-area-inset-right,0px) + 26px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:9;display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:999px;background:var(--clay);color:#1c1b19;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.nextbtn svg{flex:none}
.badge.warm{border-color:var(--clay);color:var(--clay)}

/* Briciola, il pet dell'Edicola */
.pet{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:9;width:54px;height:54px;padding:0}
.pet svg{width:54px;height:54px;display:block;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.pet .eyes{transform-origin:32px 37px;animation:blink 5.5s infinite}
.pet .happy,.pet .zz,.pet .closed{opacity:0}
.pet.happy .eyes{opacity:0}.pet.happy .happy{opacity:1}
.pet.sleepy .eyes{opacity:0}.pet.sleepy .closed,.pet.sleepy .zz{opacity:1}
.pet.sleepy svg{animation-duration:6s}
.pet.sleepy .zz{animation:zz 3s ease-in-out infinite}
.pet.hop svg{animation:hop .5s ease-out}
.pet .bubble{position:absolute;left:4px;bottom:62px;width:max-content;max-width:min(240px,calc(100vw - 100px));background:var(--raised);border:1px solid var(--line);color:var(--fg);
  font:14px/1.4 var(--sans);text-align:left;padding:8px 12px;border-radius:14px 14px 14px 4px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s;pointer-events:none}
.pet.say .bubble{opacity:1;transform:none}
.pet[hidden]{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-12px) rotate(-6deg)}70%{transform:translateY(0) scaleY(.92)}100%{transform:none}}
@keyframes zz{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(3px,-4px);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div>
      <h1 class="brand">Edicola<b>✻</b></h1>
      <div class="dateline" id="dateline">&nbsp;</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="fontBtn" aria-label="Carattere e dimensione del testo">Aa</button>
  </div>
  <div class="wrap col"><div class="progress" id="progress" aria-hidden="true"></div>
  <div class="meta"><span id="seenCount">&nbsp;</span><span id="readTime"></span></div></div>
</header>

<main class="wrap">
  <section class="hello">
    <span class="glyph" aria-hidden="true">✻</span>
    <h2 id="greet">Buongiorno, Eduardo.</h2>
    <p id="intro">Sto aprendo l'edizione di oggi.</p>
    <div id="stale" class="stale" hidden></div>
  </section>

  <section class="controls" aria-label="Come vuoi leggere">
    <div class="seg" role="group" aria-label="Ordina">
      <button id="v-notizia" aria-pressed="true" data-view="notizia">Per notizia</button>
      <button id="v-categoria" aria-pressed="false" data-view="categoria">Per categoria</button>
      <button id="v-pagina" aria-pressed="false" data-view="pagina">Per pagina</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <div id="feed"></div>
  <div class="end" id="end" hidden><b>✻</b>Per oggi è tutto.<br>La prossima edizione arriva domattina presto.</div>
</main>

<nav class="rail" id="rail" aria-label="Posizione nella pagina"><span class="thumb" id="thumb"></span></nav>
<button class="nextbtn" id="nextBtn" hidden></button>
<button class="pet" id="pet" aria-label="Briciola, il pet dell'Edicola">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 19c0-5 2-8 6-9" fill="none" stroke="#8fae7e" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M38 10c3-2 7-1 8 1-3 2-6 2-8-1z" fill="#8fae7e"/>
    <ellipse cx="23" cy="56" rx="6" ry="3.2" fill="#b85f43"/><ellipse cx="41" cy="56" rx="6" ry="3.2" fill="#b85f43"/>
    <ellipse cx="32" cy="38" rx="22" ry="19" fill="#d97757"/>
    <ellipse cx="25" cy="29" rx="7" ry="4" fill="#fff" opacity=".16"/>
    <circle cx="19" cy="44" r="3.2" fill="#f2a58a" opacity=".55"/><circle cx="45" cy="44" r="3.2" fill="#f2a58a" opacity=".55"/>
    <g class="eyes" fill="#1c1b19"><ellipse cx="25" cy="37" rx="2.8" ry="3.8"/><ellipse cx="39" cy="37" rx="2.8" ry="3.8"/><circle cx="26" cy="35.6" r=".9" fill="#fff"/><circle cx="40" cy="35.6" r=".9" fill="#fff"/></g>
    <g class="happy" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round"><path d="M21.5 38q3.5-5 7 0M35.5 38q3.5-5 7 0"/></g>
    <g class="closed" fill="none" stroke="#1c1b19" stroke-width="2" stroke-linecap="round"><path d="M22 37.5q3 2 6 0M36 37.5q3 2 6 0"/></g>
    <path d="M29.5 44q2.5 2.4 5 0" fill="none" stroke="#1c1b19" stroke-width="1.8" stroke-linecap="round"/>
    <text class="zz" x="50" y="20" fill="#cfc7b9" font-family="Inter,sans-serif" font-size="10" font-weight="600">z</text>
  </svg>
  <span class="bubble" id="petSay" role="status"></span>
</button>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Testo">
  <div class="wrap">
    <h4>Carattere del testo</h4>
    <div class="seg" role="group">
      <button id="f-serif" data-font="serif" aria-pressed="true" style="font-family:var(--serif)">Classico</button>
      <button id="f-sans" data-font="sans" aria-pressed="false" style="font-family:var(--sans)">Moderno</button>
    </div>
    <h4>Dimensione</h4>
    <div class="row">
      <div class="seg" role="group">
        <button id="s-1" data-size="0.92" aria-pressed="false">Piccolo</button>
        <button id="s-2" data-size="1" aria-pressed="true">Normale</button>
        <button id="s-3" data-size="1.1" aria-pressed="false">Grande</button>
      </div>
    </div>
    <h4>Briciola</h4>
    <div class="seg" role="group">
      <button data-pet="1" aria-pressed="true">Con me</button>
      <button data-pet="0" aria-pressed="false">A nanna</button>
    </div>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const WARM=new Set(['Promozione','Sponsorizzato','Fuori dal solito','Da non perdere']);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const longDate=d=>`${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;
function ago(t){const m=Math.round((Date.now()-new Date(t))/60000);if(m<60)return `${Math.max(m,1)} min fa`;const h=Math.round(m/60);if(h<24)return `${h} ${h===1?'ora':'ore'} fa`;const g=Math.round(h/24);return g===1?'ieri':`${g} giorni fa`}
function greeting(){const h=new Date().getHours();
  if(h>=5&&h<12)return['Buongiorno, Eduardo.',['Prenditi il tuo tempo, il caffè prima di tutto.','Ecco cosa è successo mentre dormivi.','Le tue pagine hanno lavorato stanotte.']];
  if(h>=12&&h<18)return['Buon pomeriggio, Eduardo.',['Una pausa giusta per recuperare.','Ecco quello che ti sei perso stamattina.']];
  if(h>=18&&h<23)return['Buonasera, Eduardo.',['Ultimo giro prima di staccare.','Ecco la giornata, con calma.']];
  return['Ancora sveglio, Eduardo?',['Due righe e poi a dormire.','Domattina ce n\'è un\'altra.']]}


// Briciola: reagisce a quello che leggi, all'ora e ai tocchi
const pet=(()=>{const el=$('#pet'),say=$('#petSay');let t=0,left=0,tot=0,first=true;
  const night=()=>{const h=new Date().getHours();return h>=23||h<5};
  const speak=(m,ms=3800)=>{say.textContent=m;el.classList.add('say');clearTimeout(t);t=setTimeout(()=>el.classList.remove('say'),ms)};
  const mood=()=>{el.classList.toggle('happy',tot>0&&left===0);el.classList.toggle('sleepy',night()&&left>0)};
  const lines=()=>{if(!tot)return['Sto aspettando l\'edizione…'];if(!left)return['Finito tutto! Bravo Eduardo.','Per oggi siamo a posto. Ci vediamo domattina.','Edicola chiusa, si va a vivere.'];
    const l=[`Ne mancano ${left}. Con calma.`,'Se una cosa ti incuriosisce, apri il post completo.','Il caffè l\'hai preso?','Tocca il pallino arancione a destra per saltare ai post nuovi.'];
    if(night())l.unshift('È tardi… ne leggiamo due e poi a nanna?');return l};
  let i=0;el.onclick=()=>{el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop');const l=lines();speak(l[i++%l.length])};
  const on=()=>{el.hidden=!store.get('edicola-pet',true);document.querySelectorAll('[data-pet]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.pet==='1')===!el.hidden))};
  document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{store.set('edicola-pet',b.dataset.pet==='1');on()});on();
  return{update(l,n){const prev=left;left=l;tot=n;mood();
      if(first){first=false;speak(night()?'Zzz… ah, sei tu. Ciao Eduardo.':l?`Edizione nuova: ${n} post ti aspettano.`:'Hai già visto tutto, campione.',4200);return}
      if(l<prev){el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop');if(l===0)speak('Finito tutto! Bravo Eduardo.',5000);else if(l%10===0)speak(`Ne mancano ${l}.`)}}}})();
let data=null, view=store.get('edicola-view','notizia'), cat='Tutte', hideSeen=store.get('edicola-hide',false);
let seen={};

function applyText(){const f=store.get('edicola-font','serif'),s=store.get('edicola-size',1);
  document.documentElement.style.setProperty('--text',f==='sans'?'var(--sans)':'var(--serif)');
  document.documentElement.style.setProperty('--scale',s);
  document.querySelectorAll('[data-font]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.font===f));
  document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.size===+s))}

function paras(t){return String(t||'').split(/\n\s*\n/).map(p=>`<p>${esc(p.trim()).replace(/\n/g,'<br>')}</p>`).join('')}

function mediaHTML(p){const n=p.media.length;
  const slides=p.media.map((m,i)=>m.t==='v'
    ?`<div class="slide"><video controls playsinline preload="none" ${m.poster?`poster="${esc(m.poster)}"`:''} src="${esc(m.src)}"></video></div>`
    :`<div class="slide"><img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(m.src)}" alt="Slide ${i+1} di ${n}"></div>`).join('');
  return `<div class="media"><div class="track">${slides}</div>${n>1?`<span class="count">1/${n}</span>`:''}</div>${n>1&&n<=15?`<div class="dots">${'<i></i>'.repeat(n)}</div>`:''}`}

function postHTML(p,showCat=true){const s=!!seen[p.id];
  return `<article class="post${s?' is-seen':''}" data-id="${esc(p.id)}">
  <div class="eyebrow">${showCat?`<span class="cat">${esc(p.cat)}</span><span>·</span>`:''}<span>${esc(p.pageName)}</span><span>·</span><span>${ago(p.time)}</span>${(p.tags||[]).map(t=>`<span class="badge${WARM.has(t)?' warm':''}">${esc(t)}</span>`).join('')}${p.lang==='en'?'<span class="badge">Tradotto</span>':''}<span class="seen">${s?'✓ visto':''}</span></div>
  <h3>${esc(p.title)}</h3>
  <p class="summary">${esc(p.summary)}</p>
  ${mediaHTML(p)}
  <button class="more" aria-expanded="false">Leggi il post completo <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="caption">${paras(p.caption)}<a class="orig" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Apri su Instagram ↗</a></div>
  </article>`}

function visible(){return data.posts.filter(p=>(cat==='Tutte'||p.cat===cat)&&(!hideSeen||!seen[p.id]))}

function render(){
  const posts=visible(), feed=$('#feed');
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));
  const cats=['Tutte',...(data.cats||new Set(data.posts.map(p=>p.cat)))];
  $('#chips').innerHTML=cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('')+
    `<button class="chip toggle" id="hideSeen" aria-pressed="${hideSeen}">${hideSeen?'Mostra i visti':'Nascondi i visti'}</button>`;
  if(!posts.length){feed.innerHTML=`<div class="empty">${hideSeen?'Hai visto tutto quello che c\'era qui.':'Niente in questa categoria oggi.'}</div>`;$('#end').hidden=true;bind();return}
  let html='';
  if(view==='notizia'){
    const stories=new Map();posts.forEach(p=>{const k=p.story||p.id;if(!stories.has(k))stories.set(k,[]);stories.get(k).push(p)});
    const co=new Map((data.cats||[]).map((c,i)=>[c,i]));
    [...stories.entries()].sort((a,b)=>(b[1].length>1)-(a[1].length>1)||(co.get(a[1][0].cat)??99)-(co.get(b[1][0].cat)??99)||new Date(b[1][0].time)-new Date(a[1][0].time)).forEach(([k,list])=>{html+=list.length>1
      ?`<section class="story"><div class="lbl">${list.length} pagine ne parlano</div><h4>${esc(k)}</h4>${list.map(p=>postHTML(p)).join('')}</section>`
      :postHTML(list[0])});
  }else{
    const key=view==='categoria'?'cat':'pageName';const g=new Map();posts.forEach(p=>{if(!g.has(p[key]))g.set(p[key],[]);g.get(p[key]).push(p)});
    g.forEach((list,k)=>{html+=`<section class="group"><div class="ghead"><h3>${esc(k)}</h3><span>${list.length} ${list.length===1?'post':'post'}</span></div>${list.map(p=>postHTML(p,view!=='categoria')).join('')}</section>`});
  }
  feed.innerHTML=html;$('#end').hidden=false;bind();schedule();
}

function updateCounts(){const tot=data.posts.length,n=data.posts.filter(p=>seen[p.id]).length;
  $('#seenCount').textContent=`${n} di ${tot} visti`;
  const left=data.posts.filter(p=>!seen[p.id]);
  const words=left.reduce((a,p)=>a+(p.summary+' '+p.caption).split(/\s+/).length,0);
  $('#readTime').textContent=left.length?`circa ${Math.max(1,Math.round(words/220))} min da leggere`:'tutto letto';
  const pr=$('#progress');pr.classList.toggle('fill',tot>40);
  pr.innerHTML=tot>40?`<b style="width:${tot?100*n/tot:0}%"></b>`:data.posts.map(p=>`<i class="${seen[p.id]?'on':''}"></i>`).join('');
  pet.update(left.length,tot);
  const [g,lines]=greeting();$('#greet').textContent=g;
  const line=lines[new Date().getDate()%lines.length];
  $('#intro').textContent=left.length?`${line} Le tue pagine hanno pubblicato ${tot} post: te ne restano ${left.length}.`:`${line} Hai già visto tutto: ci rivediamo domattina.`}

let io;
function bind(){
  document.querySelectorAll('.more').forEach(b=>b.onclick=()=>{const c=b.nextElementSibling,o=!c.classList.contains('open');c.classList.toggle('open',o);b.setAttribute('aria-expanded',o);b.firstChild.textContent=o?'Chiudi il post ':'Leggi il post completo '});
  document.querySelectorAll('.media').forEach(m=>{const t=m.querySelector('.track'),c=m.querySelector('.count'),d=m.parentElement.querySelectorAll('.dots i'),n=t.children.length;
    const f=()=>{const i=Math.round(t.scrollLeft/t.clientWidth);if(c)c.textContent=`${i+1}/${n}`;d.forEach((x,j)=>x.classList.toggle('on',j===i));
      t.querySelectorAll('video').forEach((v,j)=>{if(!v.paused&&v.closest('.slide')!==t.children[i])v.pause()})};
    t.addEventListener('scroll',f,{passive:true});f()});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});
  $('#hideSeen').onclick=()=>{hideSeen=!hideSeen;store.set('edicola-hide',hideSeen);render()};
  if(io)io.disconnect();
  const timers=new Map();
  io=new IntersectionObserver(es=>es.forEach(e=>{const id=e.target.dataset.id;
    if(e.isIntersecting){if(!seen[id]&&!timers.has(id))timers.set(id,setTimeout(()=>markSeen(e.target),1500))}
    else{clearTimeout(timers.get(id));timers.delete(id)}}),{threshold:.55});
  document.querySelectorAll('.post').forEach(p=>io.observe(p));
}
const rail=$('#rail'),thumb=$('#thumb'),nextBtn=$('#nextBtn');let raf=0;
function layoutRail(){raf=0;const H=document.documentElement.scrollHeight,vh=innerHeight,rh=rail.clientHeight;if(!rh)return;
  thumb.style.height=Math.max(18,rh*vh/H)+'px';thumb.style.top=(rh*scrollY/H)+'px';
  const posts=[...document.querySelectorAll('.post')];
  rail.querySelectorAll('.tick').forEach(t=>t.remove());
  posts.forEach(p=>{const b=document.createElement('button');b.className='tick'+(seen[p.dataset.id]?' seen':'');
    b.style.top=(rh*(p.getBoundingClientRect().top+scrollY)/H)+'px';b.setAttribute('aria-label',p.querySelector('h3').textContent);
    b.onclick=()=>p.scrollIntoView({behavior:'smooth',block:'start'});rail.appendChild(b)});
  const unseen=posts.filter(p=>!seen[p.dataset.id]);const top=scrollY+130,bottom=scrollY+vh;
  const below=unseen.filter(p=>p.getBoundingClientRect().top+scrollY>bottom-120);
  const above=unseen.filter(p=>p.getBoundingClientRect().bottom+scrollY<top);
  const target=below[0]||above[above.length-1];
  if(!target){nextBtn.hidden=true;return}
  const down=!!below[0],n=down?below.length:above.length;
  nextBtn.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="transform:rotate(${down?0:180}deg)"><path d="M12 5v14M5 12l7 7 7-7"/></svg>${n} da vedere ${down?'più giù':'più su'}`;
  nextBtn.hidden=false;nextBtn.onclick=()=>target.scrollIntoView({behavior:'smooth',block:'start'})}
const schedule=()=>{if(!raf)raf=requestAnimationFrame(layoutRail)};
addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule);
new ResizeObserver(schedule).observe(document.body);
function markSeen(el){const id=el.dataset.id;if(seen[id])return;seen[id]=Date.now();store.set('edicola-seen-'+data.edition,seen);
  el.classList.add('is-seen');const s=el.querySelector('.seen');if(s)s.textContent='✓ visto';updateCounts();schedule()}

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;store.set('edicola-view',view);render()});
const openSheet=o=>{$('#sheet').hidden=!o;$('#scrim').hidden=!o};
$('#fontBtn').onclick=()=>openSheet(true);$('#scrim').onclick=()=>openSheet(false);
document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{store.set('edicola-font',b.dataset.font);applyText()});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{store.set('edicola-size',+b.dataset.size);applyText()});
applyText();

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{data=d;
  seen=store.get('edicola-seen-'+d.edition,{});
  const ed=new Date(d.edition+'T12:00:00'),up=new Date(d.updated);
  $('#dateline').textContent=`${cap(longDate(ed))} · aggiornata alle ${up.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}`;
  const today=new Date();today.setHours(12,0,0,0);
  if(Math.round((today-ed)/864e5)>=1){$('#stale').hidden=false;$('#stale').textContent=`Questa è l'edizione di ${longDate(ed)}. Quella di oggi arriva prestissimo.`}
  updateCounts();render();
}).catch(()=>{$('#intro').textContent='Non riesco a caricare l\'edizione di oggi. Riprova tra poco.'});
})();
</script>
</body>
</html>
