<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AutYG</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AutYG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161514" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('autyg-tema')||'"scuro"');
  if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'chiaro':'scuro';
  if(t==='chiaro')document.documentElement.dataset.theme='light';
  if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('app')}catch(e){}})();
</script>
<style>
/* ───────── Materiali e caratteri ─────────
   Liquid Glass sui comandi (molto trasparente, con il bordo che prende luce); contenuti su superfici piene. */
:root{
  --bg:#161514; --surface:#22201e; --surface2:#2b2825; --sep:rgba(255,255,255,.08);
  --fg:#f2ede4; --soft:#d3cbbd; --muted:#9a9184; --faint:#6f685e;
  --clay:#d97757; --clay-soft:rgba(217,119,87,.15); --clay-line:rgba(217,119,87,.45);
  --glass:rgba(38,36,33,.16); --glass-strong:rgba(34,32,30,.5); --rim:rgba(255,255,255,.22); --hi:rgba(255,255,255,.42);
  --glass-shadow:0 8px 26px rgba(0,0,0,.28); --blur:saturate(210%) blur(14px) brightness(1.06); --label-shadow:0 1px 2px rgba(0,0,0,.45);
  --fill:rgba(255,255,255,.07); --thumb:rgba(255,255,255,.17);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,Georgia,serif;
  --text:var(--serif); --scale:1; --g:20px; --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --navtop:10px; --bodytop:72px;
  --au:60px; --maxw:640px; --mh:calc(100svh - var(--top) - 190px); --mcol:480px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4efe6; --surface:#fffaf2; --surface2:#ece5d7; --sep:rgba(0,0,0,.08);
  --fg:#211e1a; --soft:#433d35; --muted:#776e61; --faint:#a1978a;
  --clay:#c25f3e; --clay-soft:rgba(194,95,62,.11); --clay-line:rgba(194,95,62,.42);
  --glass:rgba(255,255,255,.26); --glass-strong:rgba(255,252,246,.62); --rim:rgba(255,255,255,.7); --hi:rgba(255,255,255,.9);
  --glass-shadow:0 8px 26px rgba(70,50,25,.14); --label-shadow:none;
  --fill:rgba(0,0,0,.055); --thumb:#fff;
  color-scheme:light;
}
/* Web app dalla schermata Home: pulsanti e titolo più in basso, lontani dall'orologio */
:root.app{--navtop:28px;--bodytop:90px}
@media (min-width:760px){:root{--g:32px;--au:68px;--maxw:1000px;--mh:min(calc(100vh - 150px),820px)}}
@media (min-width:1180px){:root{--maxw:1120px;--mcol:520px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;overscroll-behavior-y:none;min-height:100%}
html.locked,html.locked body{overflow:hidden}
html,body{margin:0}
body{position:relative;background:var(--bg);color:var(--fg);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  padding:calc(var(--top) + var(--bodytop)) max(var(--g),env(safe-area-inset-right,0px)) calc(98px + var(--bot)) max(var(--g),env(safe-area-inset-left,0px))}
@media (min-width:760px){body{padding-bottom:36px}}
.wrap{max-width:var(--maxw);margin:0 auto}
.read{max-width:700px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:10px}

.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:0;
  box-shadow:inset 0 0 0 .6px var(--rim),inset 0 1.2px 1px var(--hi),inset 0 -1px 1px rgba(0,0,0,.14),var(--glass-shadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.07))}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}
.press{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.press:active{transform:scale(.93)}

/* Sotto l'orologio dell'iPhone il contenuto si ferma: banda piena, nessuna sfumatura */
.edge{position:fixed;left:0;right:0;top:0;height:var(--top);z-index:18;background:var(--bg);pointer-events:none}

/* Barra in alto: pulsanti di vetro */
.nav{position:fixed;z-index:20;top:calc(var(--top) + var(--navtop));left:max(var(--g),env(safe-area-inset-left,0px));right:max(var(--g),env(safe-area-inset-right,0px));
  height:44px;display:flex;align-items:center;gap:8px;pointer-events:none}
.nav>*{pointer-events:auto}
.nb{height:44px;min-width:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font:500 15px var(--ui);color:var(--fg);text-decoration:none;text-shadow:var(--label-shadow)}
.nb svg{filter:drop-shadow(var(--label-shadow))}
.nb.round{width:44px;padding:0}
.navback{opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .3s;max-width:46vw}
.navback span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navback.on{opacity:1;transform:none}
.navback:not(.on){pointer-events:none}
.nav.ct .navback span{display:none}
.nav.ct .navback{padding:0;width:44px}
.ctitle{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);max-width:calc(100% - 250px);font:600 15px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity .2s,transform .25s;pointer-events:none;text-shadow:var(--label-shadow)}
.ctitle.on{opacity:1;transform:translate(-50%,-50%)}
.ctitle{padding:9px 16px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 0 0 .6px var(--rim),inset 0 1px 0 var(--hi),var(--glass-shadow)}
.spacer{flex:1}
.timer{padding:0 14px;gap:10px;font-variant-numeric:tabular-nums}
.tseg{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.08;min-width:0}
.tseg b{font:600 15px var(--round);display:flex;align-items:center;gap:5px}
.tseg small{font:500 10.5px var(--round);color:var(--soft);white-space:nowrap}
.tsep{width:.6px;height:26px;background:var(--rim)}
.timer.low .t5 b,.timer.free .t5 b{color:var(--clay)}
.tsess b{color:var(--soft)}
.timer.thaw::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 18% 30%,rgba(255,255,255,.9) 0 1.5px,transparent 2px),radial-gradient(circle at 72% 64%,rgba(255,255,255,.8) 0 1.2px,transparent 1.8px),radial-gradient(circle at 46% 22%,rgba(255,255,255,.7) 0 1px,transparent 1.6px),linear-gradient(160deg,rgba(214,240,255,.92),rgba(150,205,240,.6));
  box-shadow:inset 0 0 10px rgba(255,255,255,.9);animation:thaw 1.6s cubic-bezier(.5,0,.3,1) forwards}
.timer.thaw b{animation:thawT 1.6s ease-out}
@keyframes thaw{0%{opacity:1;clip-path:inset(0 0 0 0 round 22px)}35%{opacity:.95}100%{opacity:0;clip-path:inset(100% 0 0 0 round 22px)}}
@keyframes thawT{0%{color:#a9dcff;filter:blur(1.6px)}60%{color:#d5efff;filter:blur(.4px)}100%{filter:none}}

/* Barra delle schede */
.tabs{position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:max(12px,calc(var(--bot) - 6px));
  display:flex;align-items:flex-end;gap:10px;--th:62px}
.tabs.min{--th:50px}
.tabbar{flex:1;display:flex;height:var(--th);border-radius:calc(var(--th)/2);padding:4px;transition:height .32s cubic-bezier(.3,1.2,.5,1)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:999px;font:600 10.5px var(--ui);color:var(--fg);text-decoration:none;transition:background .25s,color .25s;text-shadow:var(--label-shadow)}
.tab svg{filter:drop-shadow(var(--label-shadow))}
.tab span{transition:opacity .2s,max-height .3s;max-height:16px;overflow:hidden}
.tabs.min .tab span{opacity:0;max-height:0}
.tab[aria-current="page"]{color:var(--clay);background:var(--fill)}
.tab .bdg{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--clay);color:#fff;font:700 10.5px/17px var(--round);text-align:center;text-shadow:none}
.srch{flex:none;width:var(--th);height:var(--th);border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:width .32s cubic-bezier(.3,1.2,.5,1),height .32s cubic-bezier(.3,1.2,.5,1)}
.acc{position:fixed;z-index:19;left:50%;bottom:calc(max(12px,calc(var(--bot) - 6px)) + 74px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;
  height:40px;padding:0 16px;border-radius:20px;font:600 13.5px var(--ui);color:var(--fg);white-space:nowrap;transition:bottom .32s cubic-bezier(.3,1.2,.5,1);text-shadow:var(--label-shadow)}
.tabs.min~.acc{bottom:calc(max(12px,calc(var(--bot) - 6px)) + 62px)}
@media (min-width:760px){
  .tabs{left:50%;right:auto;bottom:auto;top:calc(var(--top) + var(--navtop));transform:translateX(-50%);--th:44px!important;align-items:center;gap:8px}
  .tabbar{flex:none;padding:3px}
  .tab{flex-direction:row;gap:7px;padding:0 16px;font-size:14px;font-weight:500}
  .tab span{max-height:none!important;opacity:1!important;white-space:nowrap}
  .tab .bdg{position:static;margin-left:2px}
  .acc{left:auto;right:max(var(--g),env(safe-area-inset-right,0px));transform:none;bottom:28px!important}
  .ctitle{display:none}
}

/* Titolo grande e saluto */
.large{height:44px;margin-top:-62px;display:flex;align-items:center;max-width:calc(100% - 210px)}
.brand{font:600 36px/44px var(--serif);letter-spacing:-.02em;margin:0;white-space:nowrap}
@media (min-width:760px){.brand{font-size:38px}}
.brand b{color:var(--clay);font-weight:600}
.clock{font:600 13px var(--ui);color:var(--muted)}
.hello{margin-top:16px}
.hello h2{font:600 24px/1.2 var(--ui);letter-spacing:-.01em;margin:2px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:22px;background:var(--surface);text-decoration:none;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.stat:active{transform:scale(.97)}
.stat b{font:700 38px/1 var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font:600 13.5px var(--ui);color:var(--muted)}
.stat.part b{color:var(--clay)}
.stat.zero b{color:var(--muted)}
.secchips{margin-top:14px}
.dhead h2.toprow{margin:-68px 0 0}
.secchips .chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.secchips .chip em{font:600 12px var(--round);font-style:normal;color:var(--clay)}
.secchips .chip.read{color:var(--muted)}
@media (min-width:760px){.secchips{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding:2px 0}}
.toprow{height:44px;margin:-62px 0 0;display:flex;align-items:center;font:600 36px/44px var(--serif)!important;max-width:calc(100% - 210px)}
.note{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--clay-soft);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.note button{flex:none;color:var(--clay);font-weight:600;font-size:14px;padding:4px}

/* Controlli segmentati */
.seg{--n:2;--i:0;position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:999px;background:var(--fill)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));transform:translateX(calc(100% * var(--i)));border-radius:999px;
  background:var(--thumb);box-shadow:inset 0 0 0 .6px var(--rim),inset 0 1px 0 var(--hi),0 3px 10px rgba(0,0,0,.2);transition:transform .38s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;z-index:1;padding:8px 10px;border-radius:999px;font:500 14px var(--ui);color:var(--muted);transition:color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg.sm button{padding:5px 12px;font-size:12.5px}

/* Prima pagina */
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 12px;min-height:32px}
.sec h3{margin:0;font:700 21px/1.2 var(--ui);letter-spacing:-.01em}
.sec .aside{font:500 13px var(--ui);color:var(--muted)}
.resume{display:flex;align-items:center;gap:14px;margin-top:22px;padding:14px 16px;border-radius:20px;text-decoration:none;background:var(--clay-soft)}
.resume .ic{flex:none;color:var(--clay)}
.resume div{flex:1;min-width:0}
.resume b{display:block;font:600 15px var(--ui)}
.resume span{display:block;font-size:13.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;color:var(--muted)}
.duo{display:grid;gap:14px;margin-top:14px}
@media (min-width:760px){.duo{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}}
.punto{display:block;border-radius:26px;text-decoration:none;background:var(--surface);box-shadow:inset 0 0 0 1px var(--clay-line);overflow:hidden}
.punto .hero{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface2)}
.punto .cred{display:block;padding:6px 20px 0;font:500 11px var(--ui);color:var(--faint)}
.punto .pin{padding:18px 20px 20px}
.punto .lbl{display:flex;justify-content:space-between;gap:8px;font:600 13px var(--ui);color:var(--clay)}
.punto .lbl i{font-style:normal;color:var(--muted);font-weight:500}
.punto h3{font:600 25px/1.18 var(--serif);margin:10px 0 14px;text-wrap:balance}
.punto ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.punto li{font-size:14.5px;color:var(--soft);line-height:1.35;display:flex;gap:10px}
.punto li span{flex:none;width:20px;text-align:center}
.aes{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:26px;background:#0d0c0b;color:#efe8dc;text-decoration:none;overflow:hidden}
:root[data-theme="light"] .aes{background:#1c1a17}
.aes .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.aes b{font:italic 600 21px var(--serif)}
.aes span{font:500 12.5px var(--ui);color:#a39a8c}
.aes .row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (min-width:760px){.aes .row{grid-template-columns:repeat(2,1fr);flex:1;align-content:center}.punto .hero{aspect-ratio:auto;height:230px}}
.aes .row i{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#252220}
.aes .row img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92)}
/* Riquadri: un quadrato per ogni notizia, con un motivo in pixel art legato all'argomento */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:dense;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;aspect-ratio:1;padding:14px;border-radius:22px;text-decoration:none;overflow:hidden;isolation:isolate;transition:transform .25s cubic-bezier(.3,1.4,.5,1);
  background-color:var(--tc);background-image:var(--pat);background-size:var(--ps) var(--ps);background-position:var(--po,0 0);image-rendering:pixelated}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 22%,var(--tc) 72%)}
@media (min-width:760px){.tile.p3{grid-column:span 2;grid-row:span 2}}
.tile:active,.punto:active,.resume:active,.nextstory:active,.aes:active{transform:scale(.975)}
.tile .emo{font-size:26px;line-height:1;margin-bottom:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
@media (min-width:760px){.tile.p3 .emo{font-size:40px}}
.tile h3{font:600 16.5px/1.2 var(--serif);margin:0;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:760px){.tile h3{font-size:18px}.tile.p3 h3{font-size:32px;line-height:1.14;-webkit-line-clamp:4}}
.tile .tmeta{font:500 11.5px var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tbar{height:3px;border-radius:2px;background:rgba(127,127,127,.28);overflow:hidden}
.tile .tbar b{display:block;height:100%;background:var(--clay);border-radius:2px}
.tile .new{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--clay);box-shadow:0 0 0 2px var(--tc)}
.tile.done{opacity:.5}
.quiet{display:block;width:100%;text-align:center;margin-top:14px;padding:12px;border-radius:14px;color:var(--muted);font:500 14px var(--ui)}
.quiet:active{background:var(--fill)}
.allread{padding:22px 0 6px;color:var(--muted);font:italic 18px var(--serif);text-align:center}
.group{border-radius:20px;background:var(--surface);overflow:hidden}
@media (min-width:760px){.group.cols{display:grid;grid-template-columns:1fr 1fr}.group.cols .row:nth-child(2)::before{display:none}}
.row{position:relative;display:flex;align-items:center;gap:14px;min-height:52px;padding:0 16px;text-decoration:none}
.row+.row::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--sep)}
.row:active{background:var(--fill)}
.row .emo{font-size:20px;width:24px;text-align:center}
.row b{flex:1;font:500 16px var(--ui)}
.row .n{font:500 14px var(--round);color:var(--muted);font-variant-numeric:tabular-nums}
.row .n em{font-style:normal;color:var(--clay)}
.row.read b{color:var(--muted)}

/* Pagine interne */
.dhead{padding:6px 0 4px}
.dhead .emo{font-size:36px;line-height:1}
.dhead h2{font:600 clamp(28px,7.4vw,38px)/1.12 var(--serif);margin:12px 0 6px;letter-spacing:-.015em;text-wrap:balance}
.dhead p{margin:0;color:var(--muted);font-size:14px}
.nextstory{display:block;margin:30px 0 0;padding:18px 20px;border-radius:22px;text-decoration:none;background:var(--surface);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.nextstory small{display:block;font:600 13px var(--ui);color:var(--clay);margin-bottom:4px}
.nextstory b{font:600 20px/1.25 var(--serif)}
.psec{break-inside:avoid;padding-top:6px}
.psec h4{margin:30px 0 10px;font:700 15px var(--ui);color:var(--clay)}
.pitem{padding:4px 0 20px}
.pitem+.pitem{border-top:.5px solid var(--sep);padding-top:18px}
.pitem h3{font:600 calc(21px*var(--scale))/1.24 var(--serif);margin:0 0 8px;text-wrap:balance}
.pitem p{font-family:var(--text);font-size:calc(17.5px*var(--scale));line-height:1.62;color:var(--soft);margin:0}
.pfig{display:block;margin:2px 0 14px;border-radius:16px;overflow:hidden;background:var(--surface2)}
.pfig img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.pfig figcaption{padding:6px 2px 0;font:500 11.5px var(--ui);color:var(--faint);background:var(--bg)}
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font:500 12.5px var(--ui);color:var(--muted)}
.refs a{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;background:var(--fill);color:var(--fg);text-decoration:none}
.refs a.done{color:var(--muted)}
.fonti{margin:28px 0 0;font-size:13px;color:var(--faint);line-height:1.8}
.fonti a{color:var(--muted)}
@media (min-width:1024px){.pcols{columns:2;column-gap:44px}}
/* Aesthetic di oggi */
.agrid{display:grid;gap:22px;margin-top:18px}
@media (min-width:760px){.agrid{grid-template-columns:1fr 1fr;gap:26px}}
.aitem{margin:0}
.aitem figcaption{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font:500 13px var(--ui);color:var(--muted)}
.aitem figcaption a{color:var(--muted);text-decoration:none}
.aitem .nw{color:var(--clay);font-weight:600}
.frase{margin:22px 0 8px;padding:16px;border-radius:28px;background:#0d0c0b;color:#efe8dc}
:root[data-theme="light"] .frase{background:#1c1a17}
.frase .lbl{font:italic 600 20px var(--serif);margin:2px 4px 12px}
.frase blockquote{margin:14px 6px 4px;font:italic 500 21px/1.4 var(--serif);text-wrap:balance}
.frase figcaption{display:flex;justify-content:space-between;margin:10px 6px 0;font:500 12.5px var(--ui);color:#a39a8c}
.frase figcaption a{color:#a39a8c;text-decoration:none}
.frase .dots i{background:#4a443d}.frase .dots i.on{background:#efe8dc}

/* Tutto il giornale */
.controls{display:grid;gap:12px;padding:16px 0 4px}
@media (min-width:760px){.controls{grid-template-columns:minmax(0,1fr) auto;align-items:center}.controls .chips{grid-column:1 / -1}}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:14px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:11px 0;font-size:16px;color:var(--fg)}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px var(--g);margin:0 calc(-1*var(--g))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--fill);font:500 13.5px var(--ui);color:var(--soft);white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--clay);color:#fff}
.ghead{display:flex;align-items:baseline;gap:10px;margin-top:30px;padding-bottom:10px;border-bottom:.5px solid var(--sep)}
.ghead h3{margin:0;font:700 17px var(--ui)}
.ghead span{font-size:13px;color:var(--muted)}
.shead{margin:28px 0 0}
.shead .lbl{font:600 13px var(--ui);color:var(--clay)}
.shead h4{font:600 23px/1.2 var(--serif);margin:6px 0 0}

/* Post */
.post{display:grid;grid-template-areas:"text" "media" "acts" "cap";padding:26px 0 28px;border-bottom:.5px solid var(--sep);scroll-margin-top:calc(var(--top) + 70px)}
.post .ptext{grid-area:text}
.post .media{grid-area:media}
.post .acts{grid-area:acts}
.post .caption{grid-area:cap}
@media (min-width:760px){
  .post.hm{grid-template-columns:minmax(0,1fr) minmax(0,var(--mcol));grid-template-areas:"text media" "acts media" "cap media";grid-template-rows:auto auto 1fr;column-gap:36px;align-items:start}
}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:500 12.5px var(--ui);color:var(--faint);min-height:18px}
.eyebrow .pg{color:var(--muted);font-weight:600}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:600;margin-right:2px}
.st.done{color:var(--muted)}
.st.part{color:var(--clay)}
.st:empty{display:none}
.badge{font:600 10.5px var(--ui);color:var(--muted);background:var(--fill);border-radius:6px;padding:2px 7px}
.badge.warm{background:var(--clay-soft);color:var(--clay)}
/* Barra di completamento: un tratto per il testo, uno per ogni foto o video */
.pbar{display:flex;gap:3px;margin:10px 0 2px;max-width:360px}
.pbar i{flex:1;height:3px;border-radius:2px;background:var(--fill);transition:background .35s}
.pbar i.t{flex:2.2}
.pbar i.on{background:var(--clay)}
.post.s2 .pbar i.on{background:var(--muted)}
.post h3{font:600 calc(24px*var(--scale))/1.2 var(--serif);letter-spacing:-.01em;margin:8px 0 10px;text-wrap:balance;transition:color .3s}
.summary{font-family:var(--text);font-size:calc(17.5px*var(--scale));line-height:1.6;color:var(--soft);margin:0 0 18px;transition:color .3s}
.ptext.nt{margin-bottom:12px}
.post.s2 h3,.post.s2 .summary{color:var(--muted)}
/* Il riquadro ha il formato del post (quello più alto tra le sue foto e i suoi video, da 9:16 a 1,91:1),
   sta tutto sullo schermo e non scorre mai in verticale: sopra le foto la pagina scorre sempre */
.media{position:relative;--ar:.8;width:min(100%,calc(var(--mh) * var(--ar)));margin:0 auto}
.track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y;aspect-ratio:var(--ar);width:100%;border-radius:18px;background:#000;transition:aspect-ratio .2s}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;min-height:0;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;min-width:0;overflow:hidden}
.slide img,.slide video{width:100%;height:100%;max-height:100%;object-fit:contain;display:block}
.slide img{cursor:zoom-in}
/* Player in pagina: niente controlli di sistema, niente schermo intero obbligato */
.vp{position:relative;width:100%;height:100%;background:#000}
.vp video{cursor:pointer}
.vbig{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(30,28,26,.35);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.4);transition:opacity .2s,transform .2s}
.vp.on .vbig{opacity:0;transform:scale(.8);pointer-events:none}
.vbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:999px;color:#fff;
  background:rgba(20,19,17,.42);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity .3s}
.vp.on.idle .vbar{opacity:0;pointer-events:none}
.vb{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none}
.vpr{flex:1;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.vpr i{display:block;height:3px;width:100%;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.vpr i b{display:block;height:100%;width:0;background:#fff}
.vt{font:600 11.5px var(--round);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
/* Ingrandimento delle foto */
.lb{position:fixed;inset:0;z-index:45;background:#000;touch-action:pan-x pinch-zoom}
.lb .lt{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb .lt::-webkit-scrollbar{display:none}
.lb .ls{flex:0 0 100%;height:100%;display:grid;place-items:center;scroll-snap-align:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .x{position:absolute;top:calc(var(--top) + var(--navtop));right:max(var(--g),env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.lb .n{position:absolute;left:0;right:0;bottom:calc(var(--bot) + 18px);text-align:center;color:#ddd;font:600 13px var(--round)}
.gone{display:grid;gap:6px;place-items:center;text-align:center;padding:24px;color:#cfc7b9;font-size:14px;text-decoration:none}
.gone b{color:#d97757;font-weight:600}
.arrow{position:absolute;top:calc(50% - 10px);width:36px;height:36px;margin-top:-18px;border-radius:50%;background:rgba(20,19,17,.62);color:#f2ede4;display:none;place-items:center}
.arrow.pv{left:10px}.arrow.nx{right:10px}
@media (hover:hover) and (pointer:fine){.media.multi .arrow{display:grid}}
.media.single .arrow{display:none!important}
/* I puntini stanno sotto la foto, mai sopra */
.dots{display:flex;justify-content:center;align-items:center;gap:5px;height:10px;margin-top:10px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--sep);transition:background .2s,width .25s}
.dots i.v{background:var(--clay-soft)}
.dots i.seen{background:var(--faint)}
.dots i.on{background:var(--fg);width:16px}
.dots.num{font:600 12px var(--round);color:var(--muted);font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
@media (min-width:760px){.post.hm .acts{margin-top:0}}
.more{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--fill);color:var(--fg);font:600 14px var(--ui);text-decoration:none}
.more svg{transition:transform .25s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.later{display:inline-flex;align-items:center;gap:6px;padding:10px 4px 10px 10px;color:var(--muted);font:600 13.5px var(--ui)}
.post.s1 .later{color:var(--clay)}
.post.s2 .later{display:none}
.caption{display:none;margin-top:16px;padding-left:14px;border-left:2px solid var(--clay)}
.caption.open{display:block}
.caption p{font-family:var(--text);font-size:calc(17px*var(--scale));line-height:1.62;margin:0 0 .8em;overflow-wrap:anywhere}
.caption .orig{display:inline-flex;gap:6px;margin-top:4px;padding:4px 0;font-size:13px;color:var(--muted);text-decoration:none}
#sent,#puntoEnd{display:block;height:1px}
.end{text-align:center;color:var(--faint);font:italic 16px var(--serif);padding:44px 0 10px}
.empty{padding:40px 0 10px;color:var(--muted);text-align:center;font:18px var(--serif)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--clay-soft)}100%{background:transparent}}
.sk{border-radius:22px;background:var(--surface);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* Impostazioni: un foglio di vetro */
.scrim{position:fixed;inset:0;touch-action:none;background:rgba(0,0,0,.22);z-index:30;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.scrim.open{opacity:1;visibility:visible}
.sheet{position:fixed;z-index:31;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,var(--bot));max-height:84vh;overflow-y:auto;overscroll-behavior:contain;
  border-radius:34px;padding:10px 20px 22px;background:var(--glass-strong);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .45s cubic-bezier(.25,1.15,.4,1),visibility .45s}
.sheet.open{transform:none;visibility:visible}
@media (min-width:760px){.sheet{left:auto;right:max(var(--g),env(safe-area-inset-right,0px));top:calc(var(--top) + var(--navtop) + 54px);bottom:auto;width:380px;transform:translateY(-12px) scale(.96);opacity:0;transform-origin:top right;transition:transform .35s cubic-bezier(.25,1.2,.4,1),opacity .2s,visibility .35s}.sheet.open{opacity:1}.sheet .grab{display:none}}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.6;margin:0 auto 6px}
.sheet .in{display:grid;gap:10px}
.sheet h3{margin:6px 4px 0;font:700 20px var(--ui)}
.sheet h4{margin:8px 4px 0;font:600 13px var(--ui);color:var(--muted)}
.sheet .today{margin:0 4px;font:500 14px var(--ui);color:var(--soft)}
.sheet .seg{background:rgba(127,127,127,.14)}
.sheet .links{display:grid;margin-top:10px;border-radius:18px;background:rgba(127,127,127,.12);overflow:hidden}
.sheet .links button{text-align:left;padding:13px 16px;font:500 15px var(--ui);color:var(--fg)}
.sheet .links button+button{border-top:.5px solid var(--sep)}

/* Auty */
#autyLayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:9}
#auty{position:absolute;left:0;top:0;width:var(--au);height:calc(var(--au)*13/14);padding:0;pointer-events:auto;will-change:transform;transition:opacity .2s}
#auty.fixed{position:fixed;z-index:9}
#auty.ghost{opacity:0;pointer-events:none}
#auty .spr,#auty .bod{display:block;width:100%;height:100%;transform-origin:50% 92%}
#auty .spr{transition:transform .12s}
#auty .spr.flip{transform:scaleX(-1)}
#auty svg{display:block;width:100%;height:100%}
#auty .bod.squash{animation:sq .24s ease-out}
#auty .bod.hop{animation:hop .45s cubic-bezier(.3,.7,.4,1)}
#auty .bod.shake{animation:shk .35s steps(6) 2}
#auty .bod.stretch{animation:str .9s ease-in-out}
#auty .bod.nod{animation:nod .6s ease-in-out}
#auty .bod.swing{animation:swg 2.4s ease-in-out;transform-origin:50% 0}
#auty .bod.step{animation:stp .17s ease-out}
#auty .bod.spin{animation:spn .6s cubic-bezier(.4,0,.2,1)}
#auty .bod.flat{animation:flt 1.1s cubic-bezier(.3,1.4,.5,1)}
#auty .bod.faint{animation:fnt 2s ease-in-out}
#auty .bod.wobble{animation:wbl 1.4s ease-in-out}
#auty .bod.rage{animation:rge 1.3s steps(2)}
#auty .bod.giggle{animation:ggl .9s ease-in-out}
#auty .bod.shiver{animation:shv .5s steps(8) 2}
#auty .bod.boing{animation:bng .8s cubic-bezier(.3,1.6,.5,1)}
#auty.sleep .bod{animation:breathe 2.6s ease-in-out infinite}
@keyframes sq{0%{transform:scale(1.16,.8)}60%{transform:scale(.95,1.05)}100%{transform:none}}
@keyframes hop{0%{transform:none}40%{transform:translateY(-12px) scale(.95,1.08)}75%{transform:scale(1.1,.88)}100%{transform:none}}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes str{0%{transform:none}45%{transform:scale(.92,1.14)}70%{transform:scale(1.06,.94)}100%{transform:none}}
@keyframes nod{0%,100%{transform:none}50%{transform:rotate(-6deg)}}
@keyframes swg{0%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}45%{transform:rotate(-7deg)}70%{transform:rotate(4deg)}88%{transform:rotate(-2deg)}}
@keyframes stp{0%{transform:none}50%{transform:translateY(-4px)}100%{transform:none}}
@keyframes spn{0%{transform:none}50%{transform:translateY(-14px) rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes flt{0%{transform:scale(1.5,.3)}55%{transform:scale(1.45,.32)}75%{transform:scale(.85,1.2)}100%{transform:none}}
@keyframes fnt{0%{transform:none}20%{transform:rotate(-95deg) translate(-6px,4px)}80%{transform:rotate(-95deg) translate(-6px,4px)}92%{transform:translateY(-10px) rotate(8deg)}100%{transform:none}}
@keyframes wbl{0%,100%{transform:none}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@keyframes rge{0%,100%{transform:none;filter:none}25%{transform:scale(1.08) translateX(-2px);filter:saturate(2) hue-rotate(-18deg) brightness(1.15)}75%{transform:scale(1.08) translateX(2px);filter:saturate(2) hue-rotate(-18deg) brightness(1.15)}}
@keyframes ggl{0%,100%{transform:none}20%,60%{transform:translateY(-3px) rotate(-4deg)}40%,80%{transform:translateY(-1px) rotate(4deg)}}
@keyframes shv{0%,100%{transform:none}25%{transform:translateX(-1.5px) scaleY(.98)}75%{transform:translateX(1.5px) scaleY(.98)}}
@keyframes bng{0%{transform:none}30%{transform:scale(.7,1.35) translateY(-24px)}60%{transform:scale(1.2,.8)}80%{transform:scale(.95,1.06)}100%{transform:none}}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.03,.97)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.fx{position:absolute;left:0;top:0;will-change:transform,opacity}
.fx svg{display:block;width:100%;height:100%}
#autyBubble{position:fixed;left:0;top:0;z-index:21;max-width:min(270px,calc(100vw - 2*var(--g)));color:var(--fg);font:500 14px/1.4 var(--ui);background:var(--glass-strong);
  padding:10px 14px;border-radius:18px;opacity:0;transform:translate(-999px,-999px);transition:opacity .2s;pointer-events:none}
#autyBubble.on{opacity:1}
#autyBubble.asking{pointer-events:auto;max-width:min(300px,calc(100vw - 2*var(--g)))}
#autyBubble p{margin:0}
#autyBubble .bq{display:grid;gap:6px;margin-top:10px}
#autyBubble .bq button{padding:10px 12px;border-radius:14px;background:rgba(127,127,127,.18);font:600 14px var(--ui);color:var(--fg)}
#autyBubble .bq button.pri{background:var(--clay);color:#fff}

/* Pausa */
.stop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;text-align:center;touch-action:none;
  -webkit-backdrop-filter:saturate(160%) blur(26px);backdrop-filter:saturate(160%) blur(26px);background:color-mix(in srgb,var(--bg) 58%,transparent)}
.stop .in{max-width:360px;display:grid;justify-items:center;gap:14px;padding-top:150px}
.stop .sess{display:flex;gap:8px;justify-content:center;margin-top:2px}
.stop .sess span{padding:6px 12px;border-radius:999px;background:var(--fill);font:600 13px var(--round);color:var(--soft)}
.stop h2{font:600 30px/1.15 var(--serif);margin:6px 0 0;text-wrap:balance}
.stop p{margin:0;color:var(--soft);font:17px/1.5 var(--serif)}
.stop .btns{display:grid;gap:8px;width:100%;margin-top:12px}
.stop .b1{height:52px;border-radius:26px;background:var(--clay);color:#fff;font:600 16px var(--ui)}
.stop .b2{height:48px;border-radius:24px;font:600 15px var(--ui);color:var(--fg)}
#bigAuty{position:fixed;left:0;top:0;width:150px;height:139px;z-index:41;pointer-events:none;will-change:transform}
#bigAuty svg{display:block;width:100%;height:100%}
#bigAuty.bob svg{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-7px)}}

::view-transition-old(root){animation:vtOut .14s ease both}
::view-transition-new(root){animation:vtIn .24s cubic-bezier(.3,1,.5,1) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,::view-transition-old(root),::view-transition-new(root){animation:none!important;transition:none!important}}
</style>

  if(route().t!=='tutto')query='';if(!back)showDone=false;
  const run=()=>{render();const y=back?(scrolls[h]||0):0;if(y)fill(y);scrollTo(0,y);if(opts.focus){const q=$('#q');if(q)q.focus()}};
  if(!back&&!calm&&!opts.focus&&document.startViewTransition){try{const vt=document.startViewTransition(run);[vt.ready,vt.finished,vt.updateCallbackDone].forEach(p=>p&&p.catch(()=>{}))}catch(e){run()}}else run();
  Auty.route()}
function go(h,opts){const cur=location.hash||'#/';if(h===cur){if(!opts||!opts.focus)scrollTo({top:0,behavior:calm?'auto':'smooth'});else{const q=$('#q');if(q)q.focus()}return}
  scrolls[cur]=scrollY;history.pushState(null,'',h);stack.push(h);if(stack.length>40)stack.shift();onRoute(false,opts)}
addEventListener('popstate',()=>{const h=location.hash||'#/',cur=stack[stack.length-1];if(h===cur)return;scrolls[cur]=scrollY;
  let idx=-1;for(let i=stack.length-2;i>=0;i--)if(stack[i]===h){idx=i;break}
  const back=idx>=0;if(back)stack.length=idx+1;else stack.push(h);onRoute(back)});
addEventListener('hashchange',()=>{const h=location.hash||'#/';if(h!==stack[stack.length-1]){scrolls[stack[stack.length-1]]=scrollY;stack.push(h);onRoute(false)}});
$('#navBack').addEventListener('click',e=>{e.preventDefault();const p=parentOf(route());goTo(p?p.h:'#/')});
$('#srchBtn').onclick=()=>go('#/tutto',{focus:true});

document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a&&!a.id){e.preventDefault();go(a.getAttribute('href'));return}
  const b=e.target.closest('[data-act],[data-flt],[data-cat],[data-view],[data-font],[data-size],[data-pet],[data-tema]');if(!b)return;const d=b.dataset;
  if(d.flt){if(flt===d.flt)return;flt=d.flt;store.set('autyg-mostra',flt);showDone=false;applyPrefs();setTimeout(()=>{const y=scrollY;render();scrollTo(0,Math.min(y,document.documentElement.scrollHeight))},180);return}
  if(d.cat){cat=d.cat;relist();return}
  if(d.view){view=d.view;store.set('autyg-view',view);$$('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===view));segSync();setTimeout(relist,160);return}
  if(d.font){store.set('autyg-font',d.font);applyPrefs();return}
  if(d.size){store.set('autyg-size',+d.size);applyPrefs();return}
  if(d.tema){store.set('autyg-tema',d.tema);applyPrefs();if(route().t==='home'){const y=scrollY;render();scrollTo(0,y)}return}
  if(d.pet){const on=d.pet==='1';store.set('autyg-pet',on);applyPrefs();Auty.setEnabled(on);return}
  const post=b.closest('.post'),id=post&&post.dataset.id;
  switch(d.act){
    case 'more':{const c=post.querySelector('.caption'),o=!c.classList.contains('open');c.classList.toggle('open',o);b.setAttribute('aria-expanded',o);b.firstElementChild.textContent=o?'Chiudi il post':'Leggi il post completo';break}
    case 'later':{if(stOf(id)===1){mark(id,{k:'d'});Auty.cheer('Segnato come letto.')}else{mark(id,{k:'l'});Auty.say('Te lo tengo da parte in «Da finire».',2600)}break}
    case 'vplay':{vToggle(b.closest('.vp').querySelector('video'));break}
    case 'vmute':{const v=b.closest('.vp').querySelector('video');v.muted=!v.muted;b.innerHTML=v.muted?ICV.mute:ICV.snd;vIdle(b.closest('.vp'));break}
    case 'vfull':{const v=b.closest('.vp').querySelector('video');if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else if(v.requestFullscreen)v.requestFullscreen().catch(()=>{});break}
    case 'zoom':{openLb(b);break}
    case 'arrow':{const t=b.closest('.media').querySelector('.track');t.scrollBy({left:(+d.d)*t.clientWidth,behavior:calm?'auto':'smooth'});break}
    case 'donetiles':{showDone=true;const y=scrollY;render();scrollTo(0,y);break}
    case 'refresh':{openSheet(false);load(true);break}
    case 'resetread':{if(!data)break;data.posts.forEach(p=>{delete L[p.id];delete S[p.id]});PS={};store.set('autyg-punto',PS);flush();openSheet(false);render();Auty.say('Tutto di nuovo da leggere.',2600);break}}});
let qT=0;document.addEventListener('input',e=>{if(e.target.id!=='q')return;query=e.target.value;clearTimeout(qT);qT=setTimeout(relist,180)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')openSheet(false);if(e.key==='Enter'&&e.target.id==='q')e.target.blur()});
function openSheet(o){if(sheetOpen===o)return;sheetOpen=o;if(o)$('#todayLine').textContent=todayText()+(freeLeft()?` Ora libera: ancora ${mins(freeLeft()/1000)}.`:'');
  $('#sheet').classList.toggle('open',o);$('#scrim').classList.toggle('open',o);$('#sheet').setAttribute('aria-hidden',!o);lock();if(o)segSync();else setTimeout(()=>Auty.settle(),400)}
$('#setBtn').onclick=()=>openSheet(!sheetOpen);$('#scrim').onclick=()=>openSheet(false);
{let y0=null;const sh=$('#sheet');sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
  sh.addEventListener('touchend',e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>70)openSheet(false);y0=null},{passive:true})}
let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{makeTio();if(data&&route().t==='home'){const y=scrollY;render();scrollTo(0,y)}Auty.settle(true)},250)});

/* Caricamento */
function setData(d){data=d;const all=d.posts||[];if(!d.aesPosts){data.aesPosts=all.filter(p=>p.cat==='Estetica');data.posts=all.filter(p=>p.cat!=='Estetica');data.cats=(d.cats||[]).filter(c=>c!=='Estetica')}
  data._st=null;data._tl=null;data._es=null;prune()}
let noteMsg='',noteRetry=false;
function notesHTML(){let t=noteMsg;
  if(!t&&data){const ed=new Date(data.edition+'T12:00:00'),today=new Date();today.setHours(12,0,0,0);
    if(Math.round((today-ed)/DAY)>=1)t=offline?`Sei senza rete: questa è l'edizione di ${longDate(ed)}, l'ultima salvata.`:`Questa è l'edizione di ${longDate(ed)}. Quella di oggi arriva prestissimo.`;
    else if(offline)t='Sei senza rete: stai leggendo la copia salvata. Foto e video potrebbero non caricarsi.'}
  return t?`<div class="note" id="note"><span>${esc(t)}</span>${noteRetry||offline?'<button data-act="refresh">Riprova</button>':''}</div>`:''}
function notes(){if(route().t==='home'&&data){const n=$('#note'),h=notesHTML();if(n)n.outerHTML=h||'';else if(h){const s=$('.hello');if(s)s.insertAdjacentHTML('beforeend',h)}}}
const same=(a,b)=>a&&b&&a.edition===b.edition&&a.updated===b.updated;
function adopt(d){if(!d||!Array.isArray(d.posts))return;if(same(d,data)){notes();return}
  if(!data){setData(d);render();if(!store.get('autyg-pet',true))Auty.setEnabled(false);morning();return}
  if(route().t==='home'&&scrollY<300){setData(d);showDone=false;render();Auty.say('È arrivata l\'edizione nuova.',3000)}else{pending=d;Auty.say('C\'è l\'edizione nuova: la trovi tornando in prima pagina.',3600)}}
let loading=false;
async function load(manual){if(loading)return;loading=true;
  if(!data&&'caches' in window){try{const c=await caches.open('autyg-data'),r=await c.match('data.json');if(r)adopt(await r.json())}catch(e){}}
  try{const r=await fetch('data.json',{cache:'no-store'});if(!r.ok)throw new Error(r.status);const copy=r.clone(),d=await r.json();offline=false;noteMsg='';noteRetry=false;
    if('caches' in window)caches.open('autyg-data').then(c=>c.put('data.json',copy)).catch(()=>{});
    const was=data;adopt(d);if(manual&&same(d,was))Auty.say('Sei già all\'ultima edizione.',2600)}
  catch(e){offline=true;if(data)notes();else{$('#view').innerHTML=`<div class="large"><h1 class="brand">Aut<b>YG</b></h1><div class="clock"></div></div><section class="hello"><h2>Non riesco a caricare l'edizione.</h2><p>Controlla la rete e riprova.</p><div class="note"><span>Nessuna copia salvata su questo dispositivo.</span><button data-act="refresh">Riprova</button></div></section>`;clock()}}
  loading=false}
let hiddenAt=0,dayAt=ymd();
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();flush();store.set('autyg-oggi',USE);pauseAll();return}
  const away=hiddenAt?Date.now()-hiddenAt:0,newDay=ymd()!==dayAt;dayAt=ymd();clock();
  if(away>30*60e3||newDay||(stopClosed&&away>20e3)){stopClosed=false;closeStop();Timer.fresh()}else if(away>1500&&!stopOpen)Timer.thaw();
  if(away>10*60e3||newDay||offline)load(false);else if(data)updateCounts();
  morning();Auty.settle(true)});
addEventListener('online',()=>{if(offline)load(false)});
applyPrefs();clock();chrome(route());makeTio();load(false);
if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
